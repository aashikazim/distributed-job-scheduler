apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
data:
  SCHEDULER_POLL_INTERVAL: 2s
  SCHEDULER_LEASE_DURATION: 60s
  SCHEDULER_HEARTBEAT_INTERVAL: 20s
  SCHEDULER_SHUTDOWN_GRACE_PERIOD: 60s
  SCHEDULER_JANITOR_INTERVAL: 30s
  SCHEDULER_RUN_RETENTION_DAYS: "30"
  SCHEDULER_HTTP_ALLOWED_HOSTS: ""
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
