# Template only; excluded from kustomization so apply cannot overwrite existing credentials.
apiVersion: v1
kind: Secret
metadata:
  name: scheduler-secrets
  namespace: scheduler
type: Opaque
stringData:
  DB_URL: REPLACE_WITH_DATABASE_JDBC_URL
  DB_USER: REPLACE_WITH_DATABASE_USER
  DB_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  SCHEDULER_API_KEY: REPLACE_WITH_RANDOM_API_KEY
