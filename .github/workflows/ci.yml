name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (Testcontainers uses the runner Docker daemon)
        run: ./mvnw -B -ntp verify
      - name: Check script syntax
        run: |
          bash -n docker/entrypoint.sh scripts/*.sh
          python3 -m py_compile scripts/*.py
      - name: Install verified kubectl for manifest rendering
        run: |
          mkdir -p "$RUNNER_TEMP/scheduler-bin"
          curl -fsSL -o "$RUNNER_TEMP/scheduler-bin/kubectl" https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          curl -fsSL -o "$RUNNER_TEMP/scheduler-bin/kubectl.sha256" https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl.sha256
          cd "$RUNNER_TEMP/scheduler-bin"
          printf '%s  kubectl\n' "$(cat kubectl.sha256)" | sha256sum --check
          chmod +x kubectl
          echo "$RUNNER_TEMP/scheduler-bin" >> "$GITHUB_PATH"
      - name: Render all Kustomize variants
        run: |
          for directory in k8s/base k8s/overlays/local k8s/overlays/prod k8s/smoke; do
            kubectl kustomize "$directory" > /dev/null
          done
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-reports
          path: target/surefire-reports
          retention-days: 7

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and run three-worker crash smoke test
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: ./scripts/smoke.sh

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Registry image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
