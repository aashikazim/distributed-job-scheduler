x-app: &app
  image: job-scheduler:${IMAGE_TAG:-dev}
  build:
    context: .
    target: app
    args:
      GIT_SHA: ${IMAGE_TAG:-unknown}
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m,uid=10001,gid=10001
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 90s
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-environment
    DB_URL: jdbc:postgresql://postgres:5432/scheduler
    DB_USER: ${DB_USER:-scheduler}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SCHEDULER_HTTP_ALLOWED_HOSTS: ${SCHEDULER_HTTP_ALLOWED_HOSTS:-}
    SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-2s}
    SCHEDULER_LEASE_DURATION: ${SCHEDULER_LEASE_DURATION:-60s}
    SCHEDULER_HEARTBEAT_INTERVAL: ${SCHEDULER_HEARTBEAT_INTERVAL:-20s}
    SCHEDULER_JANITOR_INTERVAL: ${SCHEDULER_JANITOR_INTERVAL:-30s}
    SCHEDULER_MAX_CONCURRENT_RUNS: ${SCHEDULER_MAX_CONCURRENT_RUNS:-50}
    SCHEDULER_SHUTDOWN_GRACE_PERIOD: ${SCHEDULER_SHUTDOWN_GRACE_PERIOD:-60s}
  mem_limit: 512m
  cpus: 1.0

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: ${DB_USER:-scheduler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
  app-api:
    <<: *app
    environment:
      <<: *app-environment
      SCHEDULER_ROLE: API
      SCHEDULER_API_KEY: ${SCHEDULER_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
  app-worker:
    <<: *app
    environment:
      <<: *app-environment
      SCHEDULER_ROLE: WORKER
    deploy:
      replicas: 2
  smoke-target:
    profiles: [smoke]
    image: job-scheduler-smoke:${IMAGE_TAG:-dev}
    build:
      context: .
      target: smoke-target
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    ports:
      - "127.0.0.1:${SMOKE_PORT:-19091}:8080"
volumes:
  postgres-data:
