services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: ${DB_USER:-scheduler}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
